services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbike-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
