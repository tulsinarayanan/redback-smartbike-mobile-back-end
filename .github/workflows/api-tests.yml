name: API Tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  newman:
    runs-on: ubuntu-latest

    env:
      PORT: 5000
      MQTT_ENABLED: 'false'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase secrets are set
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets are required for API tests."
            exit 1
          fi

      - name: Start API server
        run: |
          node app.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/iot/status > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become ready in time."
          cat server.log
          exit 1

      - name: Run Newman API tests
        run: npm run test:api

      - name: Print server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop API server
        if: always()
        run: kill "$SERVER_PID" || true
